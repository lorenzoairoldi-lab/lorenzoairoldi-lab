<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 332" width="900" height="332" role="img" aria-label="Terminal: profilo di Lorenzo Airoldi">
<defs>
  <filter id="shadow" x="-10%" y="-15%" width="120%" height="130%">
    <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#1F8FFF" flood-opacity=".35"/>
  </filter>
  <linearGradient id="bgt" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0A1630"/>
    <stop offset="1" stop-color="#050B1C"/>
  </linearGradient>
  <clipPath id="c1"><rect class="w1" x="0" y="64" width="0" height="30"/></clipPath>
  <clipPath id="c2"><rect class="w2" x="0" y="104" width="0" height="30"/></clipPath>
  <clipPath id="c3"><rect class="w3" x="0" y="136" width="0" height="30"/></clipPath>
  <clipPath id="c4"><rect class="w4" x="0" y="168" width="0" height="30"/></clipPath>
  <clipPath id="c5"><rect class="w5" x="0" y="200" width="0" height="30"/></clipPath>
</defs>
<style>
  text { font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .blink { animation: blink 1s steps(1) infinite; }
  
  @keyframes k1 { 0%, 3% { width: 0; animation-timing-function: steps(48, end); } 12%, 94% { width: 490px; } 94.02%, 100% { width: 0; } }
  .w1 { animation: k1 18s infinite; }
  
  @keyframes k2 { 0%, 14% { width: 0; animation-timing-function: steps(32, end); } 20%, 94% { width: 320px; } 94.02%, 100% { width: 0; } }
  .w2 { animation: k2 18s infinite; }
  
  @keyframes k3 { 0%, 22% { width: 0; animation-timing-function: steps(48, end); } 30%, 94% { width: 470px; } 94.02%, 100% { width: 0; } }
  .w3 { animation: k3 18s infinite; }
  
  @keyframes k4 { 0%, 32% { width: 0; animation-timing-function: steps(28, end); } 38%, 94% { width: 290px; } 94.02%, 100% { width: 0; } }
  .w4 { animation: k4 18s infinite; }
  
  @keyframes k5 { 0%, 40% { width: 0; animation-timing-function: steps(68, end); } 52%, 94% { width: 650px; } 94.02%, 100% { width: 0; } }
  .w5 { animation: k5 18s infinite; }
  
  @keyframes k9 { 0%, 55% { opacity: 0; } 57%, 94% { opacity: 1; } 94.02%, 100% { opacity: 0; } }
  .f9 { animation: k9 18s infinite; opacity: 0; }
</style>

<g transform="translate(20,20)">
  <!-- Container background -->
  <rect x="1" y="1" width="858" height="290" rx="14" fill="url(#bgt)" stroke="#1F8FFF" stroke-opacity=".6" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Terminal Header -->
  <path d="M1 15a14 14 0 0 1 14-14h830a14 14 0 0 1 14 14v25H1z" fill="#0E1D40"/>
  <line x1="1" y1="40" x2="859" y2="40" stroke="#1F8FFF" stroke-opacity=".3"/>
  <circle cx="26" cy="20" r="6" fill="#FFFFFF"/>
  <circle cx="48" cy="20" r="6" fill="#5CB4FF"/>
  <circle cx="70" cy="20" r="6" fill="#1F8FFF"/>
  <text x="430.0" y="25" text-anchor="middle" fill="#8FA3C7" style="font-size:13px">lorenzo-airoldi@cloud-engineer: ~ (zsh)</text>

  <!-- Line 1: Command -->
  <g clip-path="url(#c1)">
    <text x="36" y="84">
      <tspan fill="#1F8FFF" font-weight="700">lorenzo-airoldi@cloud-engineer</tspan>
      <tspan fill="#5CB4FF" font-weight="400">:~</tspan>
      <tspan fill="#FFFFFF" font-weight="400">$ ./profile --status</tspan>
    </text>
  </g>

  <!-- Line 2: NAME -->
  <g clip-path="url(#c2)">
    <text x="36" y="124"><tspan fill="#1F8FFF" font-weight="700">NAME</tspan></text>
    <text x="170" y="124"><tspan fill="#FFFFFF" font-weight="400">Lorenzo Airoldi</tspan></text>
  </g>

  <!-- Line 3: WORK -->
  <g clip-path="url(#c3)">
    <text x="36" y="156"><tspan fill="#1F8FFF" font-weight="700">WORK</tspan></text>
    <text x="170" y="156"><tspan fill="#FFFFFF" font-weight="400">Cloud Specialist @ Sunnyvale srl</tspan></text>
  </g>

  <!-- Line 4: LOCATION -->
  <g clip-path="url(#c4)">
    <text x="36" y="188"><tspan fill="#1F8FFF" font-weight="700">LOCATION</tspan></text>
    <text x="170" y="188"><tspan fill="#FFFFFF" font-weight="400">Turin, Italy</tspan></text>
  </g>

  <!-- Line 5: MISSION -->
  <g clip-path="url(#c5)">
    <text x="36" y="220"><tspan fill="#1F8FFF" font-weight="700">MISSION</tspan></text>
    <text x="170" y="220"><tspan fill="#FFFFFF" font-weight="400">Build secure, repeatable and resilient infrastructure</tspan></text>
  </g>

  <!-- Final Prompt with Cursor -->
  <g class="f9">
    <text x="36" y="260">
      <tspan fill="#1F8FFF" font-weight="700">lorenzo-airoldi@cloud-engineer</tspan>
      <tspan fill="#5CB4FF" font-weight="400">:~</tspan>
      <tspan fill="#FFFFFF" font-weight="400">$ </tspan>
    </text>
    <g class="blink">
      <rect x="334" y="246" width="9" height="18" fill="#1F8FFF"/>
    </g>
  </g>
</g>
</svg>
