<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Lorenzo Airoldi — Cloud Specialist" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050B1C"/><stop offset=".55" stop-color="#0A1630"/><stop offset="1" stop-color="#0B2354"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#1F8FFF" stop-opacity=".32"/><stop offset="1" stop-color="#1F8FFF" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1F8FFF" stroke-opacity=".14"/><animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="6s" repeatCount="indefinite"/></pattern>
<linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="neon" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<style>
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:.95}}
@keyframes grow{from{width:0}to{width:420px}}
.t{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:68px;letter-spacing:8px;animation:rise 1.1s .3s cubic-bezier(.2,.8,.2,1) both}
.g{animation:rise 1.1s .3s both,breathe 4s 1.4s ease-in-out infinite}
.s{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:19px;letter-spacing:5px;animation:rise 1s 1s cubic-bezier(.2,.8,.2,1) both}
.p{font-family:'Fira Code','JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace;font-size:16px;letter-spacing:3px;animation:rise .8s .1s both}
.bar{animation:grow 1.2s 1.4s cubic-bezier(.2,.8,.2,1) both}
</style>
